site_name: 论文笔记
site_description: 论文阅读笔记（Markdown 自动构建为 HTML）
site_author: nth233
# 推送远程仓库后，可在这里填仓库地址以显示编辑链接
# repo_url: https://github.com/<your-name>/paper-notes

docs_dir: "docs"
site_dir: "site"

theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

plugins:
  - search

hooks:
  - hooks.py

# KaTeX（CDN）+ 自定义样式
extra_css:
  - https://unpkg.com/katex@0.16.47/dist/katex.min.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.16.47/dist/katex.min.js
  - https://unpkg.com/katex@0.16.47/dist/contrib/auto-render.min.js

extra:
  generator: false
